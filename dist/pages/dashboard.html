<body>
<div class="app-layout" id="app-layout">
  <script src="../assets/js/shared-layout.js?v=45"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>LAYOUT.injectLayout('Dashboard','Dashboard'))</script>

  <main class="main-content" id="main-content">
    <div class="page-body">
      <div class="quick-actions">
        <a href="orders.html" class="quick-action-card"><div class="quick-action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></div><span class="quick-action-label">New Order</span></a>
        <a href="clients.html" class="quick-action-card"><div class="quick-action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/><line x1="20" y1="8" x2="20" y2="14"/></svg></div><span class="quick-action-label">Add Client</span></a>
        <a href="purchases.html" class="quick-action-card"><div class="quick-action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg></div><span class="quick-action-label">New Purchase</span></a>
      </div>

      <div class="kpi-grid">
        <a href="orders.html" class="stat-card" style="text-decoration: none; color: inherit; display: block;">
          <div class="stat-icon purple"><span aria-hidden="true" style="font-size:24px;font-weight:800;line-height:1">₹</span></div>
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value" id="kpi-revenue">Loading…</div>
          <div class="stat-trend up" id="kpi-revenue-trend">Total Sales</div>
        </a>
        <a href="orders.html" class="stat-card" style="text-decoration: none; color: inherit; display: block;">
          <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></div>
          <div class="stat-label">Active Orders</div>
          <div class="stat-value" id="kpi-orders">…</div>
          <div class="stat-trend up">Pending + Processing</div>
        </a>

      </div>

      <div class="activity-row">
        <div class="card">
          <div class="card-header"><div><div class="card-title">Recent Orders</div><div class="card-subtitle">Latest 5 orders</div></div><a href="orders.html" class="btn btn-ghost btn-sm">View All</a></div>
          <div class="card-body" id="recent-orders-list"><p class="text-muted text-sm">Loading…</p></div>
        </div>
        <div class="card">
          <div class="card-header"><div><div class="card-title">Low Stock Alerts</div><div class="card-subtitle">Below minimum threshold</div></div><a href="products.html" class="btn btn-ghost btn-sm">Manage</a></div>
          <div class="card-body" id="stock-alerts-list"><p class="text-muted text-sm">Loading…</p></div>
        </div>
      </div>
    </div>

</div>
